{% extends "base.html" %}
{% block title %}{{ t('Change password') }}{% endblock %}
{% block content %}
<section class="narrow">
  <h1>{{ t('Change password') }}</h1>
  {% if g.user.must_change_password %}<p class="lead">{{ t('Choose a new password before you continue.') }}</p>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>{{ t('Current password') }}<input name="old_password" type="password" autocomplete="current-password" required></label>
    <label>{{ t('New password') }}<input name="new_password" type="password" autocomplete="new-password" minlength="12" required>
      <span class="hint">{{ t('At least 12 characters.') }}</span></label>
    <label>{{ t('Repeat new password') }}<input name="repeat_password" type="password" autocomplete="new-password" minlength="12" required></label>
    <button class="primary">{{ t('Change password') }}</button>
  </form>
</section>
{% endblock %}
